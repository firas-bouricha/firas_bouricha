<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Page autonome : GitHub Pages la sert pour toute adresse inconnue, quelle que soit sa profondeur.
       Tout est donc intégré ici (pas de chemin relatif vers les fichiers du site). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'sha256-oxji5Fv8xLSt6gYFvUSyYGHHQ7DGa31wFD9mCBlYdzg='; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#111117">
  <title>404 · firas@Portfolio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23111117'/%3E%3Cpath d='M17 21l12 11-12 11' fill='none' stroke='%23A78BFA' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='33' y='40' width='15' height='5.5' rx='2.75' fill='%2357C7FF'/%3E%3C/svg%3E">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      display: grid; place-items: center; min-height: 100vh; padding: 24px;
      background:
        radial-gradient(ellipse 50% 45% at 25% 30%, rgba(139, 92, 246, .18), transparent 70%),
        radial-gradient(ellipse 40% 40% at 80% 75%, rgba(34, 211, 238, .10), transparent 70%),
        #111117;
      font: 15px/1.7 "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: #E8E8EA;
    }
    .win { width: min(680px, 100%); border: 1px solid #2A2A33; border-radius: 16px; overflow: hidden; background: #000; box-shadow: 0 40px 80px -30px rgba(0, 0, 0, .8); }
    .bar { display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 16px; background: #0B0B0E; border-bottom: 1px solid rgba(255, 255, 255, .07); color: #8C8C99; font-size: 13px; }
    .bar i { width: 11px; height: 11px; border-radius: 50%; background: #3A3A46; }
    .bar i:first-child { background: #8B5CF6; }
    .bar span { margin-left: 10px; color: #5AF78E; }
    .out { padding: 18px 22px 24px; }
    .row { white-space: pre-wrap; overflow-wrap: anywhere; }
    .row + .ps1 { margin-top: 12px; }
    .ps1 { font-weight: 600; }
    .g { color: #5AF78E; } .r { color: #FF5C57; } .v { color: #C4A7FF; } .c { color: #57C7FF; } .b { color: #8C9EFF; } .d { color: #8C8C99; }
    .code { margin: 14px 0 6px; font-size: 56px; line-height: 1; font-weight: 700; letter-spacing: -.04em;
      background: linear-gradient(180deg, #D8C7FF, #8B5CF6 55%, #57C7FF); -webkit-background-clip: text; background-clip: text; color: transparent; }
    a { color: #5AF78E; text-decoration: none; border-bottom: 1px dashed currentColor; }
    a:hover, a:focus-visible { color: #8BFFB0; outline: none; }
    .k { display: inline-block; width: .6em; height: 1.15em; vertical-align: -.2em; background: #E8E8EA; animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .k { animation: none; } }
  </style>
</head>
<body>
  <main class="win">
    <div class="bar" aria-hidden="true"><i></i><i></i><i></i><span>&gt;_ terminal</span></div>
    <div class="out">
      <div class="row ps1"><span class="r">➜</span> <span class="v">firas</span><span class="d">@</span>Portfolio <span class="c">~</span> <span class="b">git:(<span class="r">main</span>)</span></div>
      <div class="row"><span class="v">»</span> cd <span id="path">/page-introuvable</span></div>
      <div class="row r" id="msg">zsh : cd : aucun fichier ou dossier de ce nom</div>
      <h1 class="code">404</h1>
      <p class="row d" id="lead">Cette page n'existe pas (ou plus).</p>
      <div class="row ps1"><span class="g">➜</span> <span class="v">firas</span><span class="d">@</span>Portfolio <span class="c">~</span> <span class="b">git:(<span class="r">main</span>)</span></div>
      <div class="row"><span class="v">»</span> <a id="home" href="/firas_bouricha/">cd ~ <span class="d" id="hint">(retour à l'accueil)</span></a> <span class="k" aria-hidden="true"></span></div>
    </div>
  </main>
  <script>
    (function () {
      // Adresse demandée, accueil du site (dossier du projet GitHub Pages ou racine en local)
      var path = location.pathname;
      var base = /^\/firas_bouricha(\/|$)/.test(path) ? "/firas_bouricha/" : "/";
      document.getElementById("path").textContent = decodeURIComponent(path.replace(/^\/firas_bouricha/, "")) || "/";
      document.getElementById("home").href = base;
      // Langue : même choix que sur le site, sinon langue du navigateur
      var lang = "fr";
      try { lang = localStorage.getItem("lang") || ((navigator.language || "").indexOf("fr") === 0 ? "fr" : "en"); } catch (e) {}
      if (lang === "en") {
        document.documentElement.lang = "en";
        document.title = "404 · firas@Portfolio";
        document.getElementById("msg").textContent = "zsh: cd: no such file or directory";
        document.getElementById("lead").textContent = "This page doesn't exist (anymore).";
        document.getElementById("hint").textContent = "(back to home)";
      }
    })();
  </script>
</body>
</html>
