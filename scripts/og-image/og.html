<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../css/style.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #111117; }
  .og { position: relative; width: 1200px; height: 630px; overflow: hidden; display: grid; grid-template-columns: 1fr 360px; align-items: center; gap: 56px; padding: 0 84px; box-sizing: border-box; color: #F5F5F7; font-family: 'Space Grotesk', sans-serif; }
  .og::before { content: ""; position: absolute; inset: 0; z-index: 0;
    background: radial-gradient(ellipse 55% 70% at 18% 40%, rgba(139,92,246,.28), rgba(139,92,246,.10) 40%, transparent 75%),
                radial-gradient(ellipse 40% 60% at 85% 55%, rgba(34,211,238,.16), rgba(34,211,238,.05) 45%, transparent 78%); }
  .og > * { position: relative; z-index: 1; }
  .st { display: inline-flex; align-items: center; gap: 12px; font: 500 22px 'JetBrains Mono', monospace; color: #C4C4CC; }
  .st i { width: 12px; height: 12px; border-radius: 50%; background: #34D399; box-shadow: 0 0 14px rgba(52,211,153,.7); }
  h1 { margin: 26px 0 8px; font-size: 92px; line-height: .98; letter-spacing: -.045em; font-weight: 700; }
  h2 { margin: 0; font-size: 38px; font-weight: 500; color: #C4C4CC; letter-spacing: -.02em; }
  .tags { display: flex; gap: 12px; margin-top: 34px; }
  .tags span { padding: 9px 16px; border-radius: 999px; border: 1px solid #3A3A47; background: rgba(255,255,255,.04); font: 500 20px 'JetBrains Mono', monospace; color: #E4E4EA; }
  .ps { margin-top: 38px; font: 600 23px 'JetBrains Mono', monospace; }
  .ps .a { color: #5AF78E; } .ps .u { color: #C4A7FF; } .ps .c { color: #57C7FF; } .ps .g { color: #8C9EFF; } .ps .r { color: #FF5C57; } .ps .k { display: inline-block; width: 12px; height: 24px; background: #8B5CF6; vertical-align: -4px; margin-left: 6px; box-shadow: 0 0 12px rgba(139,92,246,.8); }
  .card { border-radius: 22px; overflow: hidden; border: 1px solid #2A2A33; background: #17171E; box-shadow: 0 40px 80px -30px rgba(0,0,0,.8); transform: rotate(2.5deg); }
  .bar { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; font: 15px 'JetBrains Mono', monospace; color: #8C8C99; background: #18181F; border-bottom: 1px solid #2A2A33; }
  .bar b { width: 11px; height: 11px; border-radius: 50%; background: #3A3A46; } .bar b:first-child { background: #8B5CF6; } .bar span { margin-left: 8px; }
  .card img { display: block; width: 100%; height: 420px; object-fit: cover; object-position: 50% 30%; }
  .url { position: absolute; left: 84px; bottom: 34px; font: 500 19px 'JetBrains Mono', monospace; color: #9A9AA5; }
</style></head><body>
<div class="og">
  <div>
    <div class="st"><i></i>Ouvert aux opportunités</div>
    <h1>Firas Bouricha</h1>
    <h2>Ingénieur Cloud &amp; Infrastructure</h2>
    <div class="tags"><span>Terraform</span><span>Ansible</span><span>Proxmox</span><span>DevSecOps</span></div>
    <div class="ps"><span class="a">➜</span> <span class="u">firas</span>@Portfolio <span class="c">~</span> <span class="g">git:(<span class="r">main</span>)</span><span class="k"></span></div>
  </div>
  <div class="card"><div class="bar"><b></b><b></b><b></b><span>~/photos/portrait.webp</span></div><img src="../../assets/photos/portrait.webp" alt=""></div>
  <div class="url">firas-bouricha.github.io/firas_bouricha</div>
</div></body></html>
